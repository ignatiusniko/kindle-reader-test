[workspace]
resolver = "3"
members = [
    "apps/cli-probe",
    "apps/kindle-hwtest",
    "apps/kindle-reader",
    "apps/render-worker",
    "crates/memory-budget",
    "crates/cbz-reader",
    "crates/image-pipeline",
    "crates/persistence",
    "crates/reader-core",
    "crates/diagnostic-kit",
    "crates/test-fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
memory-budget = { path = "crates/memory-budget" }
cbz-reader = { path = "crates/cbz-reader" }
image-pipeline = { path = "crates/image-pipeline" }
persistence = { path = "crates/persistence" }
reader-core = { path = "crates/reader-core" }
diagnostic-kit = { path = "crates/diagnostic-kit" }
test-fixtures = { path = "crates/test-fixtures" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust deflate only: no native zlib/zstd/bzip2 to cross-compile, and
# every compression method we do not explicitly test is rejected.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Single-threaded (no rayon) so decoder memory stays predictable.
jpeg-decoder = { version = "0.3.2", default-features = false }
png = "0.18"
libc = "0.2"
slint = { version = "1.18", default-features = false, features = ["compat-1-2", "std", "renderer-software"] }
slint-backend-kindle = "0.7.1"
jpeg-encoder = "0.7"
# musl's allocator fragments badly under the page-decode workload (see
# docs/decisions/0003-allocator-on-musl.md); musl builds use mimalloc.
mimalloc = { version = "0.1.52", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# Codecs are slow unoptimised; keep host tests fast.
[profile.dev.package.jpeg-decoder]
opt-level = 3
[profile.dev.package.jpeg-encoder]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-pipeline]
opt-level = 2
