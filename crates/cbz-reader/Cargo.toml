[package]
name = "cbz-reader"
description = "Metadata-only CBZ indexing and bounded single-entry reads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
memory-budget.workspace = true
zip.workspace = true
# Selects the pure-Rust (miniz_oxide) deflate backend used by `zip`.
flate2.workspace = true

[dev-dependencies]
zip = { workspace = true, features = ["deflate-flate2"] }
